
services:
  postgres:
    image: postgres:15
    container_name: assetmap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: assetmap
      POSTGRES_PASSWORD: assetmap_dev_password
      POSTGRES_DB: assetmap
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/db/migrations/004_land_records.sql:/docker-entrypoint-initdb.d/02-004_land_records.sql
      - ./backend/src/db/migrations/005_engagement_features.sql:/docker-entrypoint-initdb.d/03-005_engagement_features.sql
      - ./backend/src/db/migrations/005_net_worth_history.sql:/docker-entrypoint-initdb.d/04-005_net_worth_history.sql
      - ./backend/src/db/migrations/006_phase2_features.sql:/docker-entrypoint-initdb.d/05-006_phase2_features.sql
      - ./backend/src/db/migrations/008_loan_scoring.sql:/docker-entrypoint-initdb.d/06-008_loan_scoring.sql
      - ./backend/src/db/migrations/009_b2b_api.sql:/docker-entrypoint-initdb.d/07-009_b2b_api.sql
      - ./backend/src/db/migrations/010_recovery_engine.sql:/docker-entrypoint-initdb.d/08-010_recovery_engine.sql
      - ./backend/src/db/migrations/011_fix_missing_enums_columns.sql:/docker-entrypoint-initdb.d/09-011_fix_missing_enums.sql
      - ./backend/src/db/migrations/011_plans_billing.sql:/docker-entrypoint-initdb.d/10-011_plans_billing.sql
      - ./backend/src/db/migrations/012_subscription_tiers.sql:/docker-entrypoint-initdb.d/11-012_subscription_tiers.sql
      - ./backend/src/db/migrations/013_family_vault.sql:/docker-entrypoint-initdb.d/12-013_family_vault.sql
      - ./backend/src/db/migrations/013_nomination_requests.sql:/docker-entrypoint-initdb.d/13-013_nomination_requests.sql
      - ./backend/src/db/migrations/014_nominee_update.sql:/docker-entrypoint-initdb.d/14-014_nominee_update.sql
      - ./backend/src/db/migrations/015_canonical_assets.sql:/docker-entrypoint-initdb.d/15-015_canonical_assets.sql
      - ./backend/src/db/migrations/016_manual_assets.sql:/docker-entrypoint-initdb.d/16-016_manual_assets.sql
      - ./backend/src/db/migrations/017_ancestral_search.sql:/docker-entrypoint-initdb.d/17-017_ancestral_search.sql
      - ./backend/src/db/migrations/018_transaction_classifier.sql:/docker-entrypoint-initdb.d/18-018_transaction_classifier.sql
      - ./backend/src/db/migrations/019_two_factor_auth.sql:/docker-entrypoint-initdb.d/19-019_two_factor_auth.sql
      - ./backend/src/db/migrations/020_missing_financial_tables.sql:/docker-entrypoint-initdb.d/20-020_missing_financial_tables.sql
      - ./backend/src/db/migrations/021_fix_fkey.sql:/docker-entrypoint-initdb.d/21-021_fix_fkey.sql
      - ./backend/src/db/migrations/022_audit_will_actions.sql:/docker-entrypoint-initdb.d/22-022_audit_will_actions.sql
      - ./backend/src/db/migrations/023_fix_two_factor_schema.sql:/docker-entrypoint-initdb.d/23-023_fix_two_factor_schema.sql
      - ./backend/src/db/migrations/024_b2b_audit_action.sql:/docker-entrypoint-initdb.d/24-024_b2b_audit_action.sql
      - ./backend/src/db/migrations/025_land_records_upsert_key.sql:/docker-entrypoint-initdb.d/25-025_land_records_upsert_key.sql
      - ./backend/src/db/migrations/026_will_allocation_beneficiary.sql:/docker-entrypoint-initdb.d/26-026_will_allocation_beneficiary.sql
      - ./backend/src/db/migrations/027_family_vault_members.sql:/docker-entrypoint-initdb.d/27-027_family_vault_members.sql
      - ./backend/src/db/migrations/028_support_tickets.sql:/docker-entrypoint-initdb.d/28-028_support_tickets.sql
      - ./backend/src/db/migrations/029_user_preferences.sql:/docker-entrypoint-initdb.d/29-029_user_preferences.sql
      - ./backend/src/db/migrations/030_notifications.sql:/docker-entrypoint-initdb.d/30-030_notifications.sql
      - ./backend/src/db/migrations/031_spend_ai.sql:/docker-entrypoint-initdb.d/31-031_spend_ai.sql
      - ./backend/src/db/migrations/032_agent_orchestration.sql:/docker-entrypoint-initdb.d/32-032_agent_orchestration.sql
      - ./backend/src/db/migrations/033_aa_transactions.sql:/docker-entrypoint-initdb.d/33-033_aa_transactions.sql
      - ./backend/src/db/migrations/034_agent_integration.sql:/docker-entrypoint-initdb.d/34-034_agent_integration.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U assetmap']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assetmap-internal

  redis:
    image: redis:7-alpine
    container_name: assetmap-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - assetmap-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assetmap-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://assetmap:assetmap_dev_password@postgres:5432/assetmap
      REDIS_URL: redis://redis:6379
      # In development src/db/connection.ts ignores REDIS_URL and dials REDIS_HOST/REDIS_PORT
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      FRONTEND_URL: http://localhost:5173
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/.env:/app/.env
    command: npm run dev
    networks:
      - assetmap-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assetmap-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0
    networks:
      - assetmap-internal

  # Claude asset-orchestration worker (BullMQ consumer of the backend's `asset-orchestration` queue).
  # No port. ENCRYPTION_KEY / ANTHROPIC_API_KEY come from the backend's .env so both services share
  # the same key; without ANTHROPIC_API_KEY it runs in deterministic (non-AI) mode.
  agent-worker:
    build:
      context: ./agent-worker
      dockerfile: Dockerfile
    container_name: assetmap-agent-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://assetmap:assetmap_dev_password@postgres:5432/assetmap
      REDIS_URL: redis://redis:6379
      AGENT_HEARTBEAT_FILE: /tmp/agent-worker.heartbeat
      # backend/.env carries DigiLocker credentials; keep the agent on backend-stored data only
      AGENT_ENABLE_EXTERNAL_SOURCES: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthy while the worker touches its heartbeat file (every 30s) — stale after 2 minutes
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const f=process.env.AGENT_HEARTBEAT_FILE||'/tmp/agent-worker.heartbeat';try{process.exit(Date.now()-require('fs').statSync(f).mtimeMs<120000?0:1)}catch{process.exit(1)}"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - assetmap-internal

  # python-service: commented out — ./python-service directory does not exist yet
  # python-service:
  #   build: ./python-service
  #   container_name: assetmap-python
  #   ports:
  #     - "8001:8001"
  #   volumes:
  #     - ./python-service:/app
  #   command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
  #   environment:
  #     - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
  #   networks:
  #     - assetmap-internal
  #   restart: unless-stopped

networks:
  assetmap-internal:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
